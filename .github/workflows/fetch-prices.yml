name: Fetch Stock Prices

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
    - cron: '0 14 * * 0,6'
  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Fetch prices from Yahoo Finance
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import json
          import time
          import urllib.parse

          TICKERS = [
            "STRL", "CLS.TO", "VRT", "DELL", "LRCX", "COHR", "APH",
            "MU", "DRAM", "NVDY", "FBY", "NFLY", "PEI.V", "PLAN.V",
            "V", "USDCAD=X"
          ]

          def fetch_batch(tickers):
            symbols = ",".join(tickers)
            url = f"https://query1.finance.yahoo.com/v7/finance/spark?symbols={urllib.parse.quote(symbols)}&range=1d&interval=5m"
            req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://finance.yahoo.com"
            })
            try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read())
              return data.get("spark", {}).get("result", [])
            except Exception as e:
              print(f"Batch error: {e}")
              return []

          prices = {}
          batch_size = 8
          for i in range(0, len(TICKERS), batch_size):
            batch = TICKERS[i:i+batch_size]
            results = fetch_batch(batch)
            for item in results:
              sym = item["symbol"]
              meta = item.get("response", [{}])[0].get("meta", {})
              price = meta.get("regularMarketPrice")
              prev = meta.get("previousClose") or meta.get("chartPreviousClose") or price
              if price:
                change = price - (prev or price)
                pct = (change / prev * 100) if prev else 0
                prices[sym] = {
                  "price": price,
                  "prev": prev,
                  "change": round(change, 4),
                  "pct": round(pct, 4),
                  "marketState": meta.get("marketState", "CLOSED")
                }
                print(f"  {sym}: ${price}")
            if i + batch_size < len(TICKERS):
              time.sleep(1)

          output = {
            "updated": int(time.time()),
            "prices": prices
          }

          with open("prices.json", "w") as f:
            json.dump(output, f, indent=2)

          print(f"\nWrote {len(prices)} prices to prices.json")
          PYTHON

      - name: Commit and push prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push --force-with-lease origin main || 
            git push --force origin main
          fi
