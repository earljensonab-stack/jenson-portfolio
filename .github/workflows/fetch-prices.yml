name: Fetch Stock Prices

on:
  schedule:
    # Run every 5 minutes during market hours (Mon-Fri, 13:30-21:00 UTC = 9:30 AM - 5 PM ET)
    - cron: '*/5 13-21 * * 1-5'
    # Also run once on weekends to get latest close prices
    - cron: '0 14 * * 0,6'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices from Yahoo Finance
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import json
          import time
          import urllib.parse

          TICKERS = [
            "STRL", "CLS.TO", "VRT", "DELL", "LRCX", "COHR", "APH",
            "MU", "DRAM", "NVDY", "FBY", "NFLY", "PEI.V", "PLAN.V",
            "V", "USDCAD=X"
          ]

          # Fetch in batches of 8 to avoid URL length limits
          def fetch_batch(tickers):
            symbols = ",".join(tickers)
            url = f"https://query1.finance.yahoo.com/v7/finance/spark?symbols={urllib.parse.quote(symbols)}&range=1d&interval=5m"
            req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://finance.yahoo.com"
            })
            try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read())
              return data.get("spark", {}).get("result", [])
            except Exception as e:
              print(f"Batch error: {e}")
              return []

          prices = {}
          batch_size = 8
          for i in range(0, len(TICKERS), batch_size):
            batch = TICKERS[i:i+batch_size]
            results = fetch_batch(batch)
            for item in results:
              sym = item["symbol"]
              meta = item.get("response", [{}])[0].get("meta", {})
              price = meta.get("regularMarketPrice")
              prev = meta.get("previousClose") or meta.get("chartPreviousClose") or price
              if price:
                change = price - (prev or price)
                pct = (change / prev * 100) if prev else 0
                prices[sym] = {
                  "price": price,
                  "prev": prev,
                  "change": round(change, 4),
                  "pct": round(pct, 4),
                  "marketState": meta.get("marketState", "CLOSED")
                }
                print(f"  {sym}: ${price}")
            if i + batch_size < len(TICKERS):
              time.sleep(1)  # Be polite

          output = {
            "updated": int(time.time()),
            "prices": prices
          }

          with open("prices.json", "w") as f:
            json.dump(output, f, indent=2)

          print(f"\nWrote {len(prices)} prices to prices.json")
          PYTHON

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
